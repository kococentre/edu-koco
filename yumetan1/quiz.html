<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>ユメタン1 単語テスト | Edu Koco</title>
<style>
:root{--green:#38a169;--red:#e53e3e;--purple:#667eea;--bg:#f7f8fc;--card:#fff;--text:#2d3748;--muted:#718096;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Hiragino Sans','Yu Gothic',Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:40px;}
.header{background:linear-gradient(135deg,#667eea,#764ba2);color:white;padding:20px 16px 16px;text-align:center;position:relative;}
.header-back{position:absolute;left:16px;top:20px;color:rgba(255,255,255,0.8);font-size:13px;text-decoration:none;}
.header h1{font-size:19px;font-weight:800;}
.header p{font-size:12px;opacity:.85;margin-top:3px;}
#setupScreen{padding:16px;}
.setup-card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:14px;}
.setup-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.range-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.range-btn{padding:10px 8px;border:2px solid #e2e8f0;border-radius:10px;background:white;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;text-align:center;transition:all .15s;}
.range-btn.active{border-color:var(--purple);background:#f0f0ff;color:var(--purple);}
.mode-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.mode-btn{padding:12px 8px;border:2px solid #e2e8f0;border-radius:10px;background:white;font-size:13px;font-weight:600;cursor:pointer;text-align:center;transition:all .15s;}
.mode-btn.active{border-color:var(--purple);background:#f0f0ff;color:var(--purple);}
.mode-icon{font-size:20px;display:block;margin-bottom:4px;}
.start-btn{width:100%;padding:16px;background:linear-gradient(135deg,#667eea,#764ba2);color:white;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 4px 15px rgba(102,126,234,.4);}
#quizScreen{display:none;padding:16px;}
.progress-wrap{margin-bottom:16px;}
.progress-info{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
.progress-bar{height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,#667eea,#764ba2);border-radius:3px;transition:width .4s ease;}
.question-card{background:var(--card);border-radius:20px;padding:28px 20px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:16px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.q-label{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
.q-word{font-size:32px;font-weight:800;color:var(--text);letter-spacing:1px;margin-bottom:8px;}
.q-hint{font-size:12px;color:var(--muted);}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.choice-btn{padding:16px 10px;border:2px solid #e2e8f0;border-radius:14px;background:white;font-size:15px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;min-height:58px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.3;}
.choice-btn:active{transform:scale(.97);}
.choice-btn.correct{background:#f0fff4;border-color:var(--green);color:var(--green);}
.choice-btn.wrong{background:#fff5f5;border-color:var(--red);color:var(--red);}
.choice-btn.show-answer{background:#f0fff4;border-color:var(--green);color:var(--green);}
.choice-btn:disabled{cursor:default;}
.feedback{text-align:center;padding:10px;font-size:14px;font-weight:700;min-height:36px;border-radius:10px;margin-bottom:10px;}
.feedback.correct{background:#f0fff4;color:var(--green);}
.feedback.wrong{background:#fff5f5;color:var(--red);}
.next-btn{width:100%;padding:14px;background:var(--text);color:white;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;display:none;}
#resultScreen{display:none;padding:16px;}
.result-card{background:var(--card);border-radius:20px;padding:28px 20px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.08);margin-bottom:14px;}
.result-emoji{font-size:56px;margin-bottom:10px;}
.result-title{font-size:22px;font-weight:800;margin-bottom:6px;}
.result-score{font-size:48px;font-weight:900;color:var(--purple);margin:10px 0;}
.result-sub{font-size:14px;color:var(--muted);}
.line-box{background:#f0fff4;border:2px solid var(--green);border-radius:14px;padding:16px;margin-bottom:14px;}
.line-box-title{font-size:12px;font-weight:700;color:var(--green);margin-bottom:8px;}
.line-text{background:white;border-radius:10px;padding:12px;font-size:13px;line-height:1.9;color:var(--text);white-space:pre-wrap;text-align:left;border:1px solid #c6f6d5;}
.copy-btn{width:100%;padding:12px;background:var(--green);color:white;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:8px;}
.copy-btn.done{background:#276749;}
.miss-card{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 2px 8px rgba(0,0,0,.06);margin-bottom:14px;}
.miss-title{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:10px;}
.miss-item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:13px;}
.miss-item:last-child{border-bottom:none;}
.miss-word{font-weight:700;color:var(--red);}
.action-btns{display:flex;gap:10px;}
.retry-btn{flex:1;padding:14px;background:var(--purple);color:white;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;}
.back-btn{flex:1;padding:14px;background:white;color:var(--text);border:2px solid #e2e8f0;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;}
.loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
</style>
</head>
<body>
<div class="header" style="position:relative">
  <a href="https://kococentre.github.io/edu-koco/yumetan1/" class="header-back">← 音読へ</a>
  <h1>📝 単語テスト</h1>
  <p>ユメタン1 | 英語→日本語</p>
</div>

<div id="setupScreen">
  <div class="loading" id="loadingMsg">⏳ 単語データを読み込み中...</div>
  <div id="setupContent" style="display:none">
    <div class="setup-card">
      <div class="setup-title">📖 テスト範囲</div>
      <div class="range-grid" id="rangeGrid"></div>
    </div>
    <div class="setup-card">
      <div class="setup-title">🎮 モード</div>
      <div class="mode-btns">
        <button class="mode-btn active" data-mode="4choice" onclick="setMode(this)">
          <span class="mode-icon">🔲</span>4択クイズ
        </button>
        <button class="mode-btn" data-mode="flash" onclick="setMode(this)">
          <span class="mode-icon">⚡</span>フラッシュ
        </button>
      </div>
    </div>
    <button class="start-btn" onclick="startQuiz()">🚀 テストスタート</button>
  </div>
</div>

<div id="quizScreen">
  <div class="progress-wrap">
    <div class="progress-info">
      <span id="progressText">1 / 10</span>
      <span id="scoreText">✅ 0 ❌ 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  <div class="question-card">
    <div class="q-label">この単語の意味は？</div>
    <div class="q-word" id="qWord">—</div>
    <div class="q-hint" id="qHint"></div>
  </div>
  <div class="choices" id="choices"></div>
  <div class="feedback" id="feedback"></div>
  <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次へ →</button>
</div>

<div id="resultScreen">
  <div class="result-card">
    <div class="result-emoji" id="resultEmoji">🎉</div>
    <div class="result-title" id="resultTitle">お疲れさま！</div>
    <div class="result-score" id="resultScore">10/10</div>
    <div class="result-sub" id="resultSub">正解率 100%</div>
  </div>
  <div class="line-box">
    <div class="line-box-title">📱 LINE報告用（コピーして送ろう）</div>
    <div class="line-text" id="lineText"></div>
    <button class="copy-btn" id="copyBtn" onclick="copyLine()">📋 コピーする</button>
  </div>
  <div class="miss-card" id="missCard" style="display:none">
    <div class="miss-title">❌ 間違えた単語</div>
    <div id="missList"></div>
  </div>
  <div class="action-btns">
    <button class="retry-btn" onclick="retryMiss()">🔁 間違いだけ再挑戦</button>
    <button class="back-btn" onclick="goSetup()">🔧 設定に戻る</button>
  </div>
</div>

<script>
let ALL_WORDS = [];
let SETS = [];
let selectedSetIdx = 0;
let currentMode = '4choice';
let quizWords = [];
let currentIdx = 0;
let correct = 0;
let wrong = 0;
let missedWords = [];
let answered = false;

// データ読み込み
fetch('words.json')
  .then(r => r.json())
  .then(data => {
    ALL_WORDS = data;
    buildSets();
    buildRangeGrid();
    document.getElementById('loadingMsg').style.display = 'none';
    document.getElementById('setupContent').style.display = 'block';
  })
  .catch(e => {
    document.getElementById('loadingMsg').textContent = '❌ データの読み込みに失敗しました。ページを再読み込みしてください。';
    console.error(e);
  });

function buildSets() {
  for (let start = 1; start <= 1000; start += 10) {
    const end = start + 9;
    const words = ALL_WORDS.filter(w => w['単語番号'] >= start && w['単語番号'] <= end);
    if (words.length > 0) SETS.push({ label: `No.${start}〜${end}`, start, end, words });
  }
}

function buildRangeGrid() {
  const grid = document.getElementById('rangeGrid');
  SETS.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'range-btn' + (i === 0 ? ' active' : '');
    btn.textContent = `No.${s.start}〜${s.end}`;
    btn.onclick = () => {
      document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectedSetIdx = i;
    };
    grid.appendChild(btn);
  });
}

function setMode(btn) {
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMode = btn.dataset.mode;
}

function startQuiz(words) {
  const set = words || SETS[selectedSetIdx].words;
  quizWords = [...set].sort(() => Math.random() - 0.5);
  currentIdx = 0; correct = 0; wrong = 0; missedWords = [];
  document.getElementById('setupScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('quizScreen').style.display = 'block';
  showQuestion();
}

function showQuestion() {
  answered = false;
  const w = quizWords[currentIdx];
  const total = quizWords.length;
  document.getElementById('progressText').textContent = `${currentIdx + 1} / ${total}`;
  document.getElementById('scoreText').textContent = `✅ ${correct}  ❌ ${wrong}`;
  document.getElementById('progressFill').style.width = `${(currentIdx / total) * 100}%`;
  document.getElementById('qWord').textContent = w['単語'];
  document.getElementById('qHint').textContent = `No.${w['単語番号']}`;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').style.display = 'none';
  if (currentMode === '4choice') show4Choice(w);
  else showFlash(w);
}

function show4Choice(w) {
  const others = ALL_WORDS.filter(x => x['単語番号'] !== w['単語番号']);
  const wrong3 = others.sort(() => Math.random() - 0.5).slice(0, 3);
  const options = [...wrong3, w].sort(() => Math.random() - 0.5);
  const choices = document.getElementById('choices');
  choices.style.display = 'grid';
  choices.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt['意味_短'];
    btn.onclick = () => selectChoice(btn, opt['単語番号'] === w['単語番号'], w);
    choices.appendChild(btn);
  });
}

function showFlash(w) {
  const choices = document.getElementById('choices');
  choices.style.display = 'grid';
  const ans = w['意味_短'];
  choices.innerHTML = `<button class="choice-btn" style="grid-column:1/-1;font-size:18px;min-height:70px;background:#f7f8ff;border-color:#c3c8f0" id="flashReveal">タップして答えを見る 👆</button>`;
  document.getElementById('flashReveal').onclick = () => revealFlash(ans);
}

function revealFlash(answer) {
  if (answered) return;
  answered = true;
  const choices = document.getElementById('choices');
  choices.innerHTML = `
    <div style="grid-column:1/-1;text-align:center;font-size:22px;font-weight:800;color:var(--purple);padding:10px 0">${answer}</div>
    <button class="choice-btn" style="background:#f0fff4;border-color:#38a169;color:#38a169" onclick="flashAnswer(true)">✅ 覚えてた</button>
    <button class="choice-btn" style="background:#fff5f5;border-color:#e53e3e;color:#e53e3e" onclick="flashAnswer(false)">❌ 覚えてなかった</button>
  `;
}

function flashAnswer(isOk) {
  const w = quizWords[currentIdx];
  if (isOk) { correct++; showFeedback(true, w['意味_短']); }
  else { wrong++; missedWords.push(w); showFeedback(false, w['意味_短']); }
  document.querySelectorAll('#choices .choice-btn').forEach(b => b.disabled = true);
  document.getElementById('nextBtn').style.display = 'block';
}

function selectChoice(btn, isCorrect, w) {
  if (answered) return;
  answered = true;
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.disabled = true;
    if (b.textContent === w['意味_短']) b.classList.add('show-answer');
  });
  if (isCorrect) { btn.classList.add('correct'); correct++; showFeedback(true, w['意味_短']); }
  else { btn.classList.add('wrong'); wrong++; missedWords.push(w); showFeedback(false, w['意味_短']); }
  document.getElementById('nextBtn').style.display = 'block';
}

function showFeedback(isCorrect, answer) {
  const fb = document.getElementById('feedback');
  fb.textContent = isCorrect ? '✅ 正解！' : `❌ 不正解　正解：${answer}`;
  fb.className = 'feedback ' + (isCorrect ? 'correct' : 'wrong');
}

function nextQuestion() {
  currentIdx++;
  if (currentIdx >= quizWords.length) showResult();
  else showQuestion();
}

function showResult() {
  document.getElementById('quizScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';
  const total = quizWords.length;
  const pct = Math.round((correct / total) * 100);
  const set = SETS[selectedSetIdx];
  let emoji = '🎉', title = '完璧！';
  if (pct < 50) { emoji = '😢'; title = 'もう少し！'; }
  else if (pct < 70) { emoji = '😊'; title = 'いい感じ！'; }
  else if (pct < 90) { emoji = '👍'; title = 'よくできました！'; }
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = `${correct}/${total}`;
  document.getElementById('resultSub').textContent = `正解率 ${pct}%`;
  const today = new Date();
  const dateStr = `${today.getMonth()+1}/${today.getDate()}`;
  const stars = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : '⭐';
  const lineMsg = [
    `【単語テスト報告 ${dateStr}】`,
    `📖 範囲：No.${set.start}〜${set.end}`,
    `📊 結果：${correct}/${total}問正解（${pct}%）${stars}`,
    missedWords.length > 0 ? `❌ 間違い：${missedWords.map(w => w['単語']).join('、')}` : '❌ 間違いなし！完璧！',
    '',
    '学習しました✅'
  ].join('\n');
  document.getElementById('lineText').textContent = lineMsg;
  document.getElementById('copyBtn').textContent = '📋 コピーする';
  document.getElementById('copyBtn').classList.remove('done');
  if (missedWords.length > 0) {
    document.getElementById('missCard').style.display = 'block';
    document.getElementById('missList').innerHTML = missedWords.map(w =>
      `<div class="miss-item"><span class="miss-word">${w['単語']}</span><span style="color:var(--muted)">${w['意味_短']}</span></div>`
    ).join('');
  } else {
    document.getElementById('missCard').style.display = 'none';
  }
}

function copyLine() {
  const text = document.getElementById('lineText').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ コピーしました！';
    btn.classList.add('done');
  });
}

function retryMiss() {
  if (missedWords.length === 0) return;
  startQuiz([...missedWords]);
}

function goSetup() {
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('setupScreen').style.display = 'block';
}
</script>
</body>
</html>
